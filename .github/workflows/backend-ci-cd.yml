name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - devel
    paths:
      - "src/**"
      - "db/migrations/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "db/migrations/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release step commits the version bump and moves a tag
      packages: write

    steps:
      - name: Checkout Code (full history, for the release step)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore FinancialPlanner.sln

      - name: Build
        run: dotnet build FinancialPlanner.sln -c Release --no-restore

      - name: Run Backend Unit & Integration Tests
        run: dotnet test FinancialPlanner.sln -c Release --no-build

      - name: Check the release scripts
        run: node --test .github/scripts

      # Backend version number (its own, separate from the UI's). Before migrations and deploy, so
      # the image Render builds carries it. See .github/scripts/release-api.mjs. What users read is
      # written as a Flyway migration (db/migrations/V*__release_notes_*.sql), applied by the next step.
      - name: Backend version (prepare)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node .github/scripts/release-api.mjs prepare

      # Run migrations on production database when pushing to main
      - name: Run Flyway Migrations (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLYWAY_URL: ${{ secrets.FLYWAY_DB_URL }}
          FLYWAY_USER: ${{ secrets.FLYWAY_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_DB_PASSWORD }}
        run: |
          docker run --rm \
            -e FLYWAY_URL \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            -v ${{ github.workspace }}/flyway.conf:/flyway/conf/flyway.conf \
            flyway/flyway:11 \
            migrate

      # Run migrations on development/staging database when pushing to devel
      - name: Run Flyway Migrations (Development)
        if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
        env:
          FLYWAY_URL: ${{ secrets.DEV_FLYWAY_DB_URL }}
          FLYWAY_USER: ${{ secrets.DEV_FLYWAY_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.DEV_FLYWAY_DB_PASSWORD }}
        run: |
          docker run --rm \
            -e FLYWAY_URL \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            -v ${{ github.workspace }}/flyway.conf:/flyway/conf/flyway.conf \
            flyway/flyway:11 \
            migrate

      - name: Trigger Render Deploy Hook (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is empty or not set. Check https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Triggered Render deployment for main branch."

      # - name: Login to GitHub Container Registry (devel)
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io

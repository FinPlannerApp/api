name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - devel
    paths:
      - "src/**"
      - "db/migrations/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "db/migrations/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/Presentation/API.csproj

      - name: Build
        run: dotnet build src/Presentation/API.csproj -c Release --no-restore

      # Run migrations on production database when pushing to main
      - name: Run Flyway Migrations (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLYWAY_URL: ${{ secrets.FLYWAY_DB_URL }}
          FLYWAY_USER: ${{ secrets.FLYWAY_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_DB_PASSWORD }}
        run: |
          docker run --rm \
            -e FLYWAY_URL \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            -v ${{ github.workspace }}/flyway.conf:/flyway/conf/flyway.conf \
            flyway/flyway:11 \
            migrate

      # Run migrations on development/staging database when pushing to devel
      - name: Run Flyway Migrations (Development)
        if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
        env:
          FLYWAY_URL: ${{ secrets.DEV_FLYWAY_DB_URL }}
          FLYWAY_USER: ${{ secrets.DEV_FLYWAY_DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.DEV_FLYWAY_DB_PASSWORD }}
        run: |
          docker run --rm \
            -e FLYWAY_URL \
            -e FLYWAY_USER \
            -e FLYWAY_PASSWORD \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql \
            -v ${{ github.workspace }}/flyway.conf:/flyway/conf/flyway.conf \
            flyway/flyway:11 \
            migrate

      - name: Trigger Render Deploy Hook (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Triggered Render deployment for main branch."

      - name: Login to GitHub Container Registry (devel)
        if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker to GHCR (devel)
        if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:devel

      - name: Trigger Homelab Deploy Hook (devel)
        if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
        run: |
          curl -X POST "${{ secrets.HOMELAB_DEPLOY_HOOK }}"
          echo "Triggered Homelab deployment for devel branch."

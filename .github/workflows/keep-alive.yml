name: Keep Render API Alive

# ──────────────────────────────────────────────────────────────────────────────
# Purpose
# ------------------------------------------------------------------------------
# Render Free services spin down after ~15 minutes of inactivity.
# This workflow periodically calls the API's /healthz endpoint to keep the
# service warm and reduce cold starts.
#
# Setup
# ------------------------------------------------------------------------------
# 1. Go to:
#      GitHub → Repository → Settings → Secrets and variables → Actions
#
# 2. Create a Repository Secret:
#      Name : RENDER_API_URL
#      Value: https://your-app-name.onrender.com
#      (Do NOT include a trailing slash)
#
# 3. Save this file as:
#      .github/workflows/keep-render-alive.yml
#
# Notes
# ------------------------------------------------------------------------------
# • GitHub Actions schedules are not guaranteed to execute exactly on time.
# • Using a 10-minute interval provides a safe buffer before Render's
#   15-minute inactivity timeout.
# • This workflow is intentionally non-blocking. Temporary API failures won't
#   fail the workflow because the next scheduled ping will retry.
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "*/10 * * * *" # Every 10 minutes (UTC)
  workflow_dispatch:

concurrency:
  group: keep-render-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Render API
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate configuration
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "❌ ERROR: Repository secret 'RENDER_API_URL' is missing."
            exit 1
          fi

      - name: Ping Health Endpoint
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          echo "----------------------------------------"
          echo "Starting keep-alive ping..."
          echo "Target: $API_URL/healthz"
          echo "UTC Time: $(date -u)"
          echo "----------------------------------------"

          RESULT=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code} %{time_total}" \
            --max-time 40 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            --user-agent "github-actions-render-keepalive/1.0" \
            "$API_URL/healthz")

          HTTP_STATUS=$(echo "$RESULT" | awk '{print $1}')
          RESPONSE_TIME=$(echo "$RESULT" | awk '{print $2}')

          echo ""
          echo "HTTP Status : $HTTP_STATUS"
          echo "Response    : ${RESPONSE_TIME}s"
          echo ""

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Render API is healthy."
          else
            echo "⚠️ Warning: API returned HTTP $HTTP_STATUS"
            echo "The workflow will continue."
            echo "The next scheduled ping will retry automatically."
          fi
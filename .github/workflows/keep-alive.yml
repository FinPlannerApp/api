name: Keep Render API Alive

# ── Why this exists ────────────────────────────────────────────────────────────
# Render.com free tier spins down after 15 minutes of HTTP inactivity.
# This workflow pings the /healthz endpoint every 14 minutes so the container
# stays warm, Hangfire recurring jobs don't miss their window, and first-request
# latency stays low for real users.
#
# Cost: each run takes ~5s → ~5 min/day → ~150 min/month out of 2000 free min.
#
# Setup:
#   1. Add a GitHub Actions secret named RENDER_API_URL
#      Value: https://your-app-name.onrender.com   (no trailing slash)
#   2. Place this file at: .github/workflows/keep-alive.yml
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/14 * * * *'   # every 14 minutes, all day every day
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping API
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /healthz
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "ERROR: RENDER_API_URL secret is not set."
            exit 1
          fi

          echo "Pinging $API_URL/healthz ..."

          HTTP_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 40 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            "$API_URL/healthz")

          echo "Response: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "API is alive."
          else
            echo "WARNING: API returned HTTP $HTTP_STATUS"
            # Don't fail the workflow on non-200 — the next ping will retry.
            # Failing here would spam GitHub notifications unnecessarily.
          fi

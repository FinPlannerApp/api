# flyway.conf
# Placed at repo root, alongside FinancialPlanner.sln
#
# Credentials are NOT in this file — they come from environment variables
# in CI (see the workflow patch) so nothing sensitive is committed.
# Flyway automatically picks up FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD
# from the environment if set, which is what the CI step will do.

flyway.locations=filesystem:/flyway/sql
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

# Fails the run if a migration file's checksum doesn't match what's recorded
# in flyway_schema_history — catches someone editing an already-applied
# migration file by mistake, which is exactly the kind of silent-drift bug
# that's easy to introduce without this.
flyway.validateOnMigrate=true

# Don't let Flyway auto-baseline on every run — baselining should be a
# deliberate, one-time, manual action (Step 2), not something that happens
# accidentally in CI.
flyway.baselineOnMigrate=false
